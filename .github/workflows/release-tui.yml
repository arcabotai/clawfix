name: Release TUI binaries

# Builds standalone ClawFix OpenTUI executables with Bun --compile.
# Starts with Linux x64 (+ baseline). Expand matrix as native packages are proven.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-tui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-tui:
    name: TUI tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          root_version="$(node -p "require('./package.json').version")"
          cli_version="$(node -p "require('./cli/package.json').version")"
          test "$root_version" = "$cli_version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$GITHUB_REF_NAME" = "v$root_version"
            test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install TUI dependencies
        working-directory: cli/tui
        run: bun install --frozen-lockfile

      - name: Test TUI
        working-directory: cli/tui
        run: bun test

      - name: Typecheck TUI
        working-directory: cli/tui
        run: bunx tsc --noEmit

  build-tui:
    name: tui-${{ matrix.target }}
    needs: test-tui
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-x64-baseline
            runner: ubuntu-latest
          # Alpine and other musl distros are common OpenClaw container bases, and the glibc
          # build cannot load its native library there.
          - target: linux-x64-musl
            runner: ubuntu-latest
          # Expand after linux-x64 is green:
          # - target: linux-arm64
          #   runner: ubuntu-24.04-arm
          # - target: darwin-arm64
          #   runner: macos-14
          # - target: darwin-x64
          #   runner: macos-13
          # - target: windows-x64
          #   runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun 1.2.21
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install TUI dependencies
        working-directory: cli/tui
        run: bun install --frozen-lockfile

      - name: Install target native OpenTUI package
        working-directory: cli/tui
        run: |
          case "${{ matrix.target }}" in
            linux-x64|linux-x64-baseline) pkg="@opentui/core-linux-x64" ;;
            linux-x64-musl) pkg="@opentui/core-linux-x64-musl" ;;
            linux-arm64) pkg="@opentui/core-linux-arm64" ;;
            darwin-arm64) pkg="@opentui/core-darwin-arm64" ;;
            darwin-x64) pkg="@opentui/core-darwin-x64" ;;
            windows-x64) pkg="@opentui/core-windows-x64" ;;
            *) echo "unknown target"; exit 1 ;;
          esac
          bun add --optional --no-save "${pkg}@0.4.5"

      - name: Build standalone binary
        env:
          TUI_TARGETS: ${{ matrix.target }}
          TUI_OUTDIR: ${{ github.workspace }}/dist/tui
          SKIP_INSTALL: "1"
        run: node scripts/build-tui-release.mjs

      - name: Verify artifact
        run: |
          shopt -s nullglob
          bins=(dist/tui/*.bin dist/tui/*.bin.exe)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "::error ::no clawfix-tui .bin artifacts produced"
            exit 1
          fi
          for b in "${bins[@]}"; do
            node scripts/verify-tui-artifact.mjs "$b" --target "${{ matrix.target }}"
          done
          test -d "dist/tui/assets-${{ matrix.target }}"
          test -x "dist/tui/clawfix-tui-${{ matrix.target }}" -o -f "dist/tui/clawfix-tui-${{ matrix.target }}.cmd"

      - name: Smoke binary (linux only)
        # The musl binary builds here but cannot execute on the glibc runner, so its runtime
        # smoke runs on Alpine instead. Its build is still verified above.
        if: runner.os == 'Linux' && matrix.target != 'linux-x64-musl'
        run: |
          launcher="$PWD/dist/tui/clawfix-tui-${{ matrix.target }}"
          test -x "$launcher"
          # Proves compile + OTUI_ASSET_ROOT launcher; no wasm path crash.
          node scripts/smoke-tui-binary.mjs "$launcher"
          # Proves the binary is actually usable: renders, accepts typed input, quits on Ctrl+D.
          # A compile without the Solid JSX transform passes every check above and still ships
          # a session nobody can type into.
          CLAWFIX_TUI_REQUIRE_PTY=1 node scripts/smoke-tui-interactive.mjs "$launcher"

      - name: Smoke musl binary on Alpine
        if: matrix.target == 'linux-x64-musl'
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            node:24-alpine \
            sh -lc 'apk add --no-cache python3 >/dev/null && launcher=/work/dist/tui/clawfix-tui-linux-x64-musl && test -x "$launcher" && node scripts/smoke-tui-binary.mjs "$launcher" && CLAWFIX_TUI_REQUIRE_PTY=1 node scripts/smoke-tui-interactive.mjs "$launcher"'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawfix-tui-${{ matrix.target }}
          path: |
            dist/tui/**
          if-no-files-found: error
          retention-days: 14

  publish-release-assets:
    name: attach-tui-assets
    needs: build-tui
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all TUI artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-tui
          pattern: clawfix-tui-*
          merge-multiple: false

      - name: Package target tarballs
        run: |
          set -euo pipefail
          mkdir -p release-dist
          # download-artifact layout with merge-multiple=false:
          #   release-tui/clawfix-tui-<target>/{launcher,.bin,assets-<target>/,...}
          shopt -s nullglob
          packed=0
          for dir in release-tui/clawfix-tui-*; do
            [ -d "$dir" ] || continue
            target=$(basename "$dir" | sed 's/^clawfix-tui-//')
            launcher="$dir/clawfix-tui-$target"
            binary="$dir/clawfix-tui-$target.bin"
            assets="$dir/assets-$target"
            if [ ! -f "$launcher" ] || [ ! -f "$binary" ] || [ ! -d "$assets" ]; then
              echo "::error ::incomplete artifact tree for $target under $dir"
              ls -la "$dir" || true
              exit 1
            fi
            tar -C "$dir" -czf "release-dist/clawfix-tui-${target}.tar.gz" .
            echo "packed clawfix-tui-${target}.tar.gz"
            packed=$((packed + 1))
          done
          if [ "$packed" -lt 1 ]; then
            echo "::error ::no TUI target tarballs produced"
            find release-tui -maxdepth 3 -type f | head -100
            exit 1
          fi
          (
            cd release-dist
            sha256sum ./*.tar.gz > TUI-SHA256SUMS
            ls -lah
            test -s TUI-SHA256SUMS
          )

      - name: Attest TUI release tarballs
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-dist/*.tar.gz

      - name: Wait for CLI workflow to create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "::error ::CLI release was not created within 10 minutes"
          exit 1

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/*.tar.gz
            release-dist/TUI-SHA256SUMS
          fail_on_unmatched_files: true
